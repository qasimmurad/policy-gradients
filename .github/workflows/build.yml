name: Build and deploy

# One workflow, two jobs that matter.
#
# `verify` runs on every push and pull request. It tests the tooling, checks
# that the run data committed under site/public/data matches rl/runs, and builds
# the site at the domain root, which is how local development and a Vercel
# deploy serve it.
#
# `build-pages` and `deploy` run only on main. They rebuild the site for the
# GitHub Pages sub-path and publish it. The sub-path is not hardcoded: it comes
# from actions/configure-pages, so renaming the repository does not break the
# deploy, and a user site with no sub-path produces an empty prefix that
# next.config.ts correctly ignores.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only the deploy job needs anything beyond reading the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      # No pip install. The logger and the sync script are standard library
      # only, and the torch test skips itself when torch is absent.
      - name: Test the tooling
        run: python3 -m unittest discover -s rl/tools -p "test_*.py"

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      - name: Sync run data into the site
        run: npm run sync
        working-directory: site

      # Syncing is deterministic, so a diff here means a run was committed
      # without running the sync script.
      - name: Check the committed run data is up to date
        run: |
          if ! git diff --quiet -- site/public/data; then
            echo "site/public/data is out of date. Run 'npm run sync' in site/ and commit the result."
            git diff --stat -- site/public/data
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck
        working-directory: site

      - name: Lint
        run: npm run lint
        working-directory: site

      # Built with no base path, which is what dev and a root deploy use. This
      # keeps the root configuration honest even though Pages serves a sub-path.
      - name: Build for the domain root
        run: npm run build
        working-directory: site

  build-pages:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest

    # configure-pages reads GET /repos/{owner}/{repo}/pages to find the base
    # path. That succeeds today on the workflow-level contents: read because
    # this repository is public, so this block is insurance rather than a fix:
    # it keeps the step working if the repository is ever made private. A
    # job-level block zeroes every scope it omits, so contents: read has to be
    # repeated here for checkout.
    permissions:
      contents: read
      pages: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Reports where Pages will serve this repository, for example
      # "/policy-gradients" for a project site or "" for a user site.
      - name: Read the Pages base path
        id: pages
        uses: actions/configure-pages@v6

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      # prebuild runs the sync script, so the published site always carries the
      # run data committed in this revision. postbuild writes out/.nojekyll,
      # without which Pages would drop every underscore prefixed path: all of
      # _next/ and the _synthetic-example run.
      - name: Build for the Pages base path
        run: npm run build
        working-directory: site
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload the static export
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/out

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build-pages
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
